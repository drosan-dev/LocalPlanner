name: Build

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LocalPlanner.sln

      - name: Build
        run: dotnet build LocalPlanner.sln --configuration Release --no-restore
